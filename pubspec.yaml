name: pemetaan_pohon
description: "Aplikasi Pemerintahan untuk Manajemen Surveyor"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.2
  flutter_map: ^8.3.2
  fl_chart: 0.69.2
  image_picker: ^1.2.1
  geolocator: ^14.0.2
  latlong2: 0.9.1
  flutter_map_marker_cluster: ^8.2.2
  excel: ^4.0.6
  web: ^1.1.1
  archive: ^3.6.1
  url_launcher: ^6.3.2
  google_fonts: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/image/hero_cirebon.png
    - assets/image/logo.png